<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>قارئ المستندات</title>
  <meta name="description" content="اقرا بيانات البطاقة الشخصية والبطاقة الضريبية والسجل التجاري من صورة، على جهازك">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%230f2a44'/><path d='M20 16h16l10 10v22H20zM36 16v10h10M26 34h14M26 41h10' stroke='%231f9d74' stroke-width='4' fill='none' stroke-linejoin='round' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="bar">
    <div class="bar-in">
      <span class="brand"><span class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h4"/></svg></span>قارئ المستندات</span>
      <span class="chip-gold">نسخة أولى</span>
      <button class="btn ghost" id="history-btn" type="button">السجل</button>
    </div>
  </header>

  <main class="wrap" id="app">
    <section class="head">
      <span class="eyebrow">من صورة لبيانات جاهزة</span>
      <h1>صوّر المستند، وإحنا نطلّع بياناته</h1>
      <p>بطاقة الرقم القومي، والبطاقة الضريبية، والسجل التجاري. القراءة كلها بتحصل على جهازك، والصورة مش بتتبعت لأي مكان.</p>
    </section>

    <section class="panel" id="start">
      <label class="drop" id="drop" for="file">
        <span class="drop-ic" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/></svg></span>
        <b>اختار صورة أو ملف</b>
        <small>أو اسحبه هنا. الصورة الواضحة والمفرودة بتتقري أدق.</small>
        <input type="file" id="file" accept="image/*,application/pdf" hidden>
      </label>
      <div class="row">
        <label class="btn" for="camera">صوّر بالموبايل</label>
        <input type="file" id="camera" accept="image/*" capture="environment" hidden>
        <div class="field inline">
          <label for="type">نوع المستند</label>
          <select id="type">
            <option value="auto">اكتشفه لوحدك</option>
            <option value="id">بطاقة الرقم القومي</option>
            <option value="tax">البطاقة الضريبية</option>
            <option value="cr">السجل التجاري</option>
          </select>
        </div>
      </div>
    </section>

    <section class="panel" id="work" hidden>
      <h2>جاري القراءة</h2>
      <ol class="steps" id="steps"></ol>
      <p class="note">أول مرة بتاخد وقت أطول عشان محرك القراءة بيتحمّل.</p>
    </section>

    <div id="result" hidden></div>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
  <script src="assets/digit-templates.js"></script>
  <script src="assets/digits.js"></script>
  <script src="assets/image.js"></script>
  <script src="assets/fields.js"></script>
  <script src="assets/ocr.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
